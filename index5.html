<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>My Works | Richmond Aning</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f1ec;
    --surface: #ffffff;
    --surface2: #ece9e3;
    --border: rgba(0,0,0,0.09);
    --border-hover: rgba(0,0,0,0.2);
    --text: #1a1815;
    --text-muted: rgba(26,24,21,0.5);
    --text-dim: rgba(26,24,21,0.28);
    --accent: #8b6f4e;
    --accent-warm: #6b5038;
    --strip-h: 72vh;
    --nav-h: 64px;
    --ease: cubic-bezier(0.25,0.46,0.45,0.94);
    --ease-out: cubic-bezier(0.16,1,0.3,1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100dvh;
    overflow-x: hidden;
    cursor: none;
  }

  /* ── Custom cursor ── */
  .cursor {
    position: fixed; top: 0; left: 0;
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: width .25s var(--ease), height .25s var(--ease), background .25s;
    mix-blend-mode: multiply;
  }
  .cursor.hovered { width: 40px; height: 40px; }
  .cursor.dragging { width: 64px; height: 64px; background: rgba(200,185,154,0.3); border: 1px solid var(--accent); }
  @media (pointer: coarse) { .cursor { display: none; } body { cursor: auto; } }

  /* ── Nav ── */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--nav-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem;
    border-bottom: 1px solid var(--border);
    background: rgba(244,241,236,0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nav__brand {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    letter-spacing: 0.01em;
    color: var(--text);
    text-decoration: none;
  }
  .nav__brand span { color: var(--accent); font-style: italic; }
  .nav__links { display: flex; gap: 2rem; align-items: center; }
  .nav__links a {
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--text-muted);
    transition: color .2s;
    position: relative;
  }
  .nav__links a::after {
    content: '';
    position: absolute; bottom: -3px; left: 0; right: 0;
    height: 1px; background: var(--accent);
    transform: scaleX(0); transform-origin: left;
    transition: transform .3s var(--ease);
  }
  .nav__links a:hover, .nav__links a.active { color: var(--text); }
  .nav__links a:hover::after, .nav__links a.active::after { transform: scaleX(1); }
  .nav__menu-btn {
    display: none; background: none; border: none;
    color: var(--text); cursor: pointer; padding: 4px;
  }
  @media (max-width: 640px) {
    .nav__links { display: none; flex-direction: column; position: absolute;
      top: var(--nav-h); left: 0; right: 0; background: var(--surface);
      padding: 1.5rem 2rem; gap: 1.25rem; border-bottom: 1px solid var(--border); }
    .nav__links.open { display: flex; }
    .nav__menu-btn { display: block; }
  }

  /* ── Header ── */
  .header {
    padding: calc(var(--nav-h) + 3rem) 2rem 2rem;
    max-width: 1400px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 0.5rem;
  }
  .header__eyebrow {
    font-size: 0.72rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .header__title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2.4rem, 6vw, 5rem);
    line-height: 1.05;
    font-weight: 400;
  }
  .header__title em { font-style: italic; color: var(--accent); }
  .header__hint {
    margin-top: 1rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .header__hint svg { width: 20px; flex-shrink: 0; }

  /* ── Strip ── */
  .strip-section {
    position: relative;
    padding: 0 2rem 2rem;
  }
  .strip-track {
    display: flex;
    gap: 1rem;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    cursor: grab;
    padding-bottom: 1rem;
    scrollbar-width: none;
  }
  .strip-track::-webkit-scrollbar { display: none; }
  .strip-track.is-dragging { cursor: grabbing; }
  .strip-track.is-dragging .strip__item { pointer-events: none; }

  .strip__item {
    flex: 0 0 auto;
    scroll-snap-align: start;
    position: relative;
    overflow: hidden;
    border-radius: 3px;
    transition: transform .4s var(--ease);
    cursor: pointer;
  }
  .strip__item.size-s { width: clamp(180px, 22vw, 280px); height: var(--strip-h); }
  .strip__item.size-m { width: clamp(240px, 30vw, 380px); height: var(--strip-h); }
  .strip__item.size-l { width: clamp(300px, 38vw, 480px); height: var(--strip-h); }
  .strip__item.size-xl { width: clamp(360px, 46vw, 580px); height: var(--strip-h); }

  .strip__img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .7s var(--ease), filter .4s;
    filter: brightness(0.7) saturate(0.9);
  }
  .strip__item:hover .strip__img {
    transform: scale(1.04);
    filter: brightness(0.85) saturate(1.1);
  }

  .strip__label {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 3rem 1.25rem 1.25rem;
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
    display: flex; align-items: flex-end; justify-content: space-between;
    transform: translateY(8px); opacity: 0;
    transition: transform .35s var(--ease), opacity .35s;
  }
  .strip__item:hover .strip__label { transform: translateY(0); opacity: 1; }
  .strip__label-num {
    font-size: 0.7rem; letter-spacing: 0.15em;
    color: var(--accent); font-weight: 400;
  }
  .strip__label-name {
    font-family: 'DM Serif Display', serif;
    font-size: 1rem; color: var(--text); font-style: italic;
  }
  .strip__label-open {
    width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); flex-shrink: 0;
    transition: background .2s, border-color .2s;
  }
  .strip__item:hover .strip__label-open { background: var(--accent); border-color: var(--accent); color: #0d0d0d; }

  /* ── Progress bar ── */
  .strip-progress {
    height: 1px;
    background: var(--border);
    position: relative;
    margin: 0 2rem 3rem;
  }
  .strip-progress__fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .1s linear;
  }

  /* ── Lightbox overlay ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(244,241,236,0.97);
    display: flex; align-items: stretch;
    opacity: 0; pointer-events: none;
    transition: opacity .4s var(--ease);
  }
  .lightbox.open { opacity: 1; pointer-events: all; }

  .lightbox__img-wrap {
    flex: 1 1 60%;
    overflow: hidden; position: relative;
  }
  .lightbox__img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.06);
    transition: transform .6s var(--ease-out);
  }
  .lightbox.open .lightbox__img { transform: scale(1); }

  .lightbox__info {
    flex: 0 0 320px;
    display: flex; flex-direction: column;
    padding: 3rem 2.5rem;
    border-left: 1px solid var(--border);
    overflow-y: auto;
  }
  .lightbox__num {
    font-size: 0.7rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 1rem;
  }
  .lightbox__title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    line-height: 1.1; margin-bottom: 1.5rem;
  }
  .lightbox__text {
    font-size: 0.9rem; line-height: 1.75;
    color: var(--text-muted); flex: 1;
  }
  .lightbox__nav {
    display: flex; gap: 0.75rem; margin-top: 2.5rem;
  }
  .lightbox__nav-btn {
    flex: 1; height: 44px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text); border-radius: 2px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    transition: background .2s, border-color .2s;
  }
  .lightbox__nav-btn:hover { background: var(--surface); border-color: var(--border-hover); }
  .lightbox__close {
    position: absolute; top: 1.5rem; right: 1.5rem;
    width: 40px; height: 40px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 50%; cursor: pointer; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
    z-index: 10;
  }
  .lightbox__close:hover { background: var(--surface); }

  @media (max-width: 768px) {
    .lightbox { flex-direction: column; }
    .lightbox__img-wrap { flex: 0 0 50dvh; }
    .lightbox__info { flex: 1; border-left: none; border-top: 1px solid var(--border); padding: 1.5rem; }
    .lightbox__close { top: 1rem; right: 1rem; }
    :root { --strip-h: 55vw; }
    .strip__item.size-s { width: 60vw; }
    .strip__item.size-m { width: 72vw; }
    .strip__item.size-l { width: 82vw; }
    .strip__item.size-xl { width: 88vw; }
  }

  /* ── Footer line ── */
  .footer {
    padding: 2rem;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.72rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
  }

  /* ── Scroll hint animation ── */
  @keyframes nudge {
    0%,100%{ transform: translateX(0); }
    50%{ transform: translateX(-8px); }
  }
  .header__hint svg { animation: nudge 2s ease-in-out 1.5s 3; }

  /* ── Loading fade ── */
  body { animation: fadeIn .6s var(--ease) both; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<!-- Nav -->
<nav class="nav">
  <a class="nav__brand" href="#">Richmond <span>Aning</span></a>
  <div class="nav__links" id="navLinks">
    <a href="index.html">Programming</a>
    <a href="index2.html">Graphic Design</a>
    <a href="index3.html" class="active">Who Am I?</a>
  </div>
  <button class="nav__menu-btn" id="menuBtn" aria-label="Toggle menu">
    <svg width="22" height="16" viewBox="0 0 22 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="0" y1="2" x2="22" y2="2"/>
      <line x1="0" y1="8" x2="22" y2="8"/>
      <line x1="0" y1="14" x2="22" y2="14"/>
    </svg>
  </button>
</nav>

<!-- Header -->
<header class="header">
  <p class="header__eyebrow">Creative Works — 2025</p>
  <h1 class="header__title">Creative works<br>across <em>various fields</em><br>&amp; inspiration</h1>
  <p class="header__hint">
    <svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M0 6h20M15 1l5 5-5 5"/>
    </svg>
    Drag or scroll to explore — click any image to open
  </p>
</header>

<!-- Strip -->
<section class="strip-section">
  <div class="strip-track" id="stripTrack">
    <!-- Items injected by JS -->
  </div>
</section>
<div class="strip-progress"><div class="strip-progress__fill" id="progressFill"></div></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview">
  <div class="lightbox__img-wrap">
    <img class="lightbox__img" id="lbImg" src="" alt=""/>
  </div>
  <div class="lightbox__info">
    <p class="lightbox__num" id="lbNum">01 / 19</p>
    <h2 class="lightbox__title" id="lbTitle">Assemblage</h2>
    <p class="lightbox__text" id="lbText"></p>
    <div class="lightbox__nav">
      <button class="lightbox__nav-btn" id="lbPrev">← Prev</button>
      <button class="lightbox__nav-btn" id="lbNext">Next →</button>
    </div>
  </div>
  <button class="lightbox__close" id="lbClose" aria-label="Close">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M1 1l12 12M13 1L1 13"/>
    </svg>
  </button>
</div>

<!-- Footer -->
<footer class="footer">
  <span>Richmond Aning — Portfolio</span>
  <span>© 2025</span>
</footer>

<script>
const works = [
  { num:'01', title:'Assemblage', size:'s', text:'A meticulous gathering of fragments — found objects, textures, and memories arranged into something entirely new. Each piece asks what it means to make order from chaos.' },
  { num:'02', title:'Wherewithal', size:'m', text:'The quiet resources we carry within. A study in inner strength expressed through layered forms and restrained palette, speaking to resilience.' },
  { num:'03', title:'Surreptitious', size:'xl', text:'Things that happen without announcement. Covert moments caught mid-motion, exploring the beauty of the unnoticed and the peripheral.' },
  { num:'04', title:'Onomatopoeia', size:'l', text:'Sound made visible. This piece translates the physical sensation of noise into form — the hiss, the crack, the low hum translated into colour and line.' },
  { num:'05', title:'Nemesis', size:'s', text:'Every creative act has a shadow. An exploration of the forces that resist and refine — the opposing pressure that ultimately shapes the work.' },
  { num:'06', title:'Penumbra', size:'m', text:'The partial shadow between full light and full dark. A meditation on ambiguity, threshold states, and the space where definition dissolves.' },
  { num:'07', title:'Cathedral', size:'s', text:'Scale as devotion. Examining how architecture encodes belief — the soaring vertical as aspiration, the nave as shared breath, the spire as longing.' },
  { num:'08', title:'Propinquity', size:'l', text:'Nearness that creates connection. A study of how proximity — physical and emotional — generates meaning between otherwise unrelated elements.' },
  { num:'09', title:'Lissome', size:'s', text:'Effortless flexibility captured in stillness. The grace of things that bend without breaking, that move with an ease that belies their complexity.' },
  { num:'10', title:'Moiety', size:'m', text:'Half of a whole. An interrogation of division — how splitting something reveals new edges, new surfaces, new understandings of the original form.' },
  { num:'11', title:'Mondegreen', size:'s', text:'The beautiful mistake — a misheard phrase that becomes its own truth. Celebrating misinterpretation as a form of genuine creative perception.' },
  { num:'12', title:'Reverie', size:'xl', text:'A daydream given edges. The space between sleep and waking where ideas arrive unasked, carrying a logic that evaporates in full consciousness.' },
  { num:'13', title:'Gambol', size:'s', text:'Joyful, unpurposeful movement. A reminder that play is a serious mode of inquiry — that the skip and leap carry their own kind of rigour.' },
  { num:'14', title:'Forbearance', size:'l', text:'Patience as active practice. The visible effort of restraint — how holding back shapes the work as much as any mark placed on the surface.' },
  { num:'15', title:'Evanescent', size:'s', text:'Fading even as it forms. An investigation into impermanence — how the most affecting things resist being held, how beauty exists in its own leaving.' },
  { num:'16', title:'Embrocation', size:'l', text:'The act of rubbing a healing substance in. Slow, deliberate, repeated gestures — care as methodology, attention as material.' },
  { num:'17', title:'Bucolic', size:'m', text:'Rural ease reinterpreted. Not nostalgia but a re-examination of slowness, growth cycles, and the intelligence embedded in landscape.' },
  { num:'18', title:'Eloquence', size:'m', text:'Expression that exceeds its medium. When image or form says something language cannot — the precise resonance of the exactly right visual choice.' },
  { num:'19', title:'Threshold', size:'s', text:'The liminal point between states. Standing at the door — between inside and outside, before and after, known and utterly unfamiliar.' },
];

const sizeMap = { s:'size-s', m:'size-m', l:'size-l', xl:'size-xl' };
const track = document.getElementById('stripTrack');

works.forEach((w, i) => {
  const item = document.createElement('div');
  item.className = `strip__item ${sizeMap[w.size] || 'size-m'}`;
  item.dataset.index = i;
  item.innerHTML = `
    <img class="strip__img" src="img/${i+1}.jpg" alt="${w.title}" loading="lazy" onerror="this.parentElement.style.background='#1c1c1c';this.style.display='none'"/>
    <div class="strip__label">
      <div>
        <div class="strip__label-num">${w.num}</div>
        <div class="strip__label-name">${w.title}</div>
      </div>
      <div class="strip__label-open">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M1 9L9 1M9 1H3M9 1V7"/>
        </svg>
      </div>
    </div>`;
  item.addEventListener('click', () => openLightbox(i));
  track.appendChild(item);
});

// ── Drag scroll ──
let isDragging = false, startX = 0, scrollLeft = 0, moved = false;
track.addEventListener('mousedown', e => {
  isDragging = true; moved = false;
  startX = e.pageX - track.offsetLeft;
  scrollLeft = track.scrollLeft;
  track.classList.add('is-dragging');
  document.getElementById('cursor').classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const x = e.pageX - track.offsetLeft;
  const walk = (x - startX) * 1.4;
  if (Math.abs(walk) > 5) moved = true;
  track.scrollLeft = scrollLeft - walk;
  updateProgress();
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  track.classList.remove('is-dragging');
  document.getElementById('cursor').classList.remove('dragging');
});
track.addEventListener('click', e => { if (moved) e.stopImmediatePropagation(); }, true);

// Progress
const fill = document.getElementById('progressFill');
function updateProgress() {
  const max = track.scrollWidth - track.clientWidth;
  fill.style.width = max > 0 ? (track.scrollLeft / max * 100) + '%' : '0%';
}
track.addEventListener('scroll', updateProgress);

// ── Lightbox ──
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
const lbNum = document.getElementById('lbNum');
const lbText = document.getElementById('lbText');
let currentIdx = 0;

function openLightbox(i) {
  currentIdx = i;
  const w = works[i];
  lbImg.src = `img/${i+1}.jpg`;
  lbImg.alt = w.title;
  lbTitle.textContent = w.title;
  lbNum.textContent = `${w.num} / ${works.length}`;
  lbText.textContent = w.text;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
function navigate(dir) {
  currentIdx = (currentIdx + dir + works.length) % works.length;
  openLightbox(currentIdx);
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => navigate(-1));
document.getElementById('lbNext').addEventListener('click', () => navigate(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// ── Cursor ──
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});
document.querySelectorAll('a, button, .strip__item').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
});

// ── Mobile nav ──
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('open');
});

updateProgress();
</script>
</body>
</html>
